<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#B9771A">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%231C1F22%27/%3E%3Crect x=%279%27 y=%279%27 width=%2714%27 height=%274%27 rx=%272%27 fill=%27%23E3A84A%27/%3E%3Crect x=%277%27 y=%2715%27 width=%2718%27 height=%274%27 rx=%272%27 fill=%27%23E3A84A%27/%3E%3Crect x=%275%27 y=%2721%27 width=%2722%27 height=%274%27 rx=%272%27 fill=%27%23E3A84A%27/%3E%3C/svg%3E">
<title>Start3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=IBM+Plex+Mono:wght@400;500;700&family=Onest:wght@400;500;700&display=swap">
<style>
/* Layout: one app column, layer-line motif from FDM printing; views routed by hash (home / new / catalog / live / orders / track-ID / admin) */
:root{
  --bg:#EEF0EC; --surface:#FAFBF8; --ink:#1C1F22; --muted:#5E6660; --line:#D5D9D2;
  --accent:#B9771A; --accent-ink:#FFFFFF; --accent-soft:#F3E4C8;
  --good:#2E8B57; --warn:#B07D0E; --bad:#C0442F; --info:#2F63C9; --wa:#1F9D55;
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141619; --surface:#1C1F23; --ink:#ECEDE8; --muted:#9AA19B; --line:#2E3338;
  --accent:#E3A84A; --accent-ink:#1A1408; --accent-soft:#3A2E19;
  --good:#5CC48A; --warn:#E6B640; --bad:#EE7A63; --info:#7EA5F2; --wa:#4CD08A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141619; --surface:#1C1F23; --ink:#ECEDE8; --muted:#9AA19B; --line:#2E3338;
  --accent:#E3A84A; --accent-ink:#1A1408; --accent-soft:#3A2E19;
  --good:#5CC48A; --warn:#E6B640; --bad:#EE7A63; --info:#7EA5F2; --wa:#4CD08A; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1100px;margin:0 auto;padding-block:0 48px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em;font-weight:700}
h2{font-size:clamp(20px,3vw,26px)} h3{font-size:15px;font-weight:500}
p{margin:0}
a{color:var(--accent)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.label{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
button,.btn{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 16px;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible,summary:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-ghost{background:transparent}
.btn-sm{padding:6px 10px;font-size:13px;border-radius:8px}
button:disabled{opacity:.45;cursor:not-allowed}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:10px 14px;padding-block:10px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.mark{display:grid;gap:2px;width:22px}
.mark i{display:block;height:4px;border-radius:2px;background:var(--accent)}
.mark i:nth-child(1){width:60%;margin:0 auto}.mark i:nth-child(2){width:80%;margin:0 auto}.mark i:nth-child(3){width:100%}
.logo b{font-family:var(--f-display);font-size:20px;font-weight:700}
.logo b span{color:var(--accent)}
nav{display:flex;gap:2px;flex-wrap:wrap;margin-left:auto}
nav a{color:var(--muted);text-decoration:none;padding:7px 10px;border-radius:8px;font-weight:500;font-size:14px}
nav a[aria-current="page"]{color:var(--ink);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
nav a .cnt{font-family:var(--f-mono);font-size:11px;background:var(--accent);color:var(--accent-ink);border-radius:99px;padding:0 6px;margin-left:4px}
.langs{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.langs button{border:0;border-radius:0;padding:6px 9px;font-size:12px;background:transparent;color:var(--muted)}
.langs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.demo-note{font-size:12.5px;color:var(--muted);text-align:center;padding:8px 0 0}

.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:32px;align-items:center;padding-block:36px 24px}
.hero h1{font-size:clamp(30px,5.2vw,52px);line-height:1.05}
.hero h1 span{display:block}
.hero h1 span:nth-child(2){color:var(--accent)}
.hero p{margin-top:16px;max-width:46ch;color:var(--muted);font-size:16.5px}
.hero-cta{display:flex;gap:12px;margin-top:24px;flex-wrap:wrap}
.screen{background:#111316;border-radius:16px;position:relative;overflow:hidden;max-width:100%}
.screen canvas{width:100%;height:100%;display:block}
.hero-art{aspect-ratio:4/3}
.hud{position:absolute;left:12px;right:12px;bottom:10px;display:flex;justify-content:space-between;gap:8px;color:#C9CEC8;font-family:var(--f-mono);font-size:11.5px}
.live{color:#FF6B57;font-weight:600}
.live::before{content:"●";margin-right:5px;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.25}}
.facts{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;border-block:1px solid var(--line);padding-block:20px;margin-block:8px 40px}
.facts div{display:grid;gap:2px}
.facts b{font-family:var(--f-display);font-size:24px;font-weight:700}
.facts span{color:var(--muted);font-size:13.5px}
.section{display:grid;gap:20px;margin-bottom:48px}
.services{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.svc{padding:20px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:grid;gap:8px;align-content:start}
.svc h3{font-family:var(--f-display);font-size:16px;font-weight:700}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:0;padding:0;counter-reset:s}
.steps li{list-style:none;border-top:2px solid var(--line);padding-top:12px;counter-increment:s}
.steps li::before{content:"0" counter(s);display:block;font-family:var(--f-mono);font-size:12px;color:var(--accent);margin-bottom:4px;font-weight:600}
.steps li:first-child{border-color:var(--accent)}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.mat-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;vertical-align:middle;border:1px solid var(--line)}
details{border-bottom:1px solid var(--line);padding-block:14px}
summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:12px}
summary::after{content:"+";font-family:var(--f-mono);color:var(--accent)}
details[open] summary::after{content:"–"}
details p{margin-top:8px;color:var(--muted);max-width:70ch}
footer{border-top:1px solid var(--line);padding-block:24px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:13.5px;max-width:1100px;margin:0 auto}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:clamp(16px,3vw,24px)}
.split{display:grid;grid-template-columns:1.15fr .85fr;gap:24px;align-items:start}
.split>*{min-width:0}
.page-head{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;padding-block:28px 20px}
.page-head h1{font-size:clamp(24px,4vw,34px)}
.page-head p{color:var(--muted);margin-top:6px;max-width:62ch}
.form{display:grid;gap:18px}
.field{display:grid;gap:6px;min-width:0}
.field>label,.field>.flabel{font-weight:600;font-size:13.5px}
select,input[type=number],input[type=text],input[type=tel],input[type=email],input[type=url],textarea{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
textarea{min-height:70px;resize:vertical}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.row>.field{flex:1 1 150px}
.check{display:flex;gap:8px;align-items:start;font-size:14px}
.check input{margin-top:4px}
.fieldset-h{font-family:var(--f-display);font-size:14px;font-weight:500;border-top:1px solid var(--line);padding-top:16px}
.drop{border:1.5px dashed var(--line);border-radius:12px;padding:20px;text-align:center;display:grid;gap:6px;place-items:center;cursor:pointer;background:var(--bg);position:relative}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop input{position:absolute;width:1px;height:1px;opacity:0}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs img{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.viewer{aspect-ratio:16/10;border-radius:12px;background:var(--bg);border:1px solid var(--line);position:relative;overflow:hidden;cursor:grab;touch-action:none}
.viewer canvas{width:100%;height:100%;display:block}
.viewer .vhint{position:absolute;bottom:8px;right:10px;font-size:11.5px;color:var(--muted);font-family:var(--f-mono)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);padding:0;position:relative}
.sw[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:2px}
.sw:disabled::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:var(--bad);transform:rotate(45deg)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;border-radius:0;flex:1 1 auto;font-weight:500;padding:9px 10px;background:var(--bg);font-size:13.5px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.quote{display:grid;gap:14px;align-content:start;position:sticky;top:calc(env(safe-area-inset-top,0px) + 72px)}
.price{font-family:var(--f-display);font-size:40px;font-weight:700;line-height:1}
.price small{font-size:16px;font-weight:500;color:var(--muted)}
dl.specs{display:grid;grid-template-columns:auto 1fr;gap:7px 16px;margin:0}
dl.specs dt{color:var(--muted)} dl.specs dd{margin:0;font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--bg);border:1px solid var(--line);white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.pill.good{color:var(--good)} .pill.warn{color:var(--warn)} .pill.bad{color:var(--bad)} .pill.info{color:var(--info)} .pill.acc{color:var(--accent)} .pill.mut{color:var(--muted)} .pill.wa{color:var(--wa)}
.pill.wrap{white-space:normal}
.note{font-size:13px;color:var(--muted)}
.err{font-size:13px;color:var(--bad)}
.ok{font-size:13px;color:var(--good)}
.formula{font-family:var(--f-mono);font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;overflow-x:auto;white-space:nowrap}
.disc{display:grid;gap:4px;font-size:13.5px}
.disc div{display:flex;justify-content:space-between;gap:8px}
.disc .mono{color:var(--good)}

.cat,.live-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:grid;grid-template-rows:auto 1fr}
.item canvas{width:100%;aspect-ratio:4/3;display:block;background:var(--bg);max-width:100%}
.item .body{padding:16px;display:grid;gap:10px;align-content:space-between}
.item .meta,.lcard .meta{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.item .cost{font-family:var(--f-display);font-size:20px;font-weight:700}
.lcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:grid}
.lcard .screen{border-radius:0;aspect-ratio:4/3}
.lcard .screen>a{display:block;height:100%}
.lcard .body{padding:12px 14px;display:grid;gap:6px}
.lcard .body a{color:var(--ink);text-decoration:none}
.lcard .body a:hover b{color:var(--accent)}
.ov{position:absolute;top:8px;left:10px;right:10px;display:flex;justify-content:space-between;gap:8px;font-family:var(--f-mono);font-size:11px;color:#C9CEC8;pointer-events:none}
.play{position:absolute;left:10px;bottom:10px;background:rgba(0,0,0,.65);color:#fff;border-color:rgba(255,255,255,.35)}
.badge-ch{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--ink);color:var(--bg);white-space:nowrap}

.olist{display:grid;gap:10px}
.ocard{display:grid;grid-template-columns:1fr auto;gap:6px 16px;align-items:center;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.ocard>*{min-width:0}
.ocard a.t{color:var(--ink);text-decoration:none}
.ocard a.t:hover b{color:var(--accent)}
.ocard .sub{color:var(--muted);font-size:13px}
.loyal{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.loyal i{width:22px;height:8px;border-radius:4px;background:var(--line)}
.loyal i.on{background:var(--accent)}
.track{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:20px}
.track div{display:grid;gap:6px;font-size:12.5px;color:var(--muted);min-width:0}
.track div::before{content:"";height:6px;border-radius:3px;background:var(--line)}
.track .done::before{background:var(--accent)}
.track .now{color:var(--ink);font-weight:600}
.track .now::before{background:linear-gradient(90deg,var(--accent) 40%,var(--line) 40%)}
.cam{aspect-ratio:16/10}
.cam .tag{position:absolute;top:10px;left:12px;right:12px;font-family:var(--f-mono);font-size:11.5px;color:#C9CEC8;display:flex;gap:12px;flex-wrap:wrap}
.big-pct{font-family:var(--f-display);font-size:60px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.bar-line{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.bar-line i{display:block;height:100%;background:var(--accent);width:0;transition:width .8s linear}
.bar-line.sm{height:6px}
.msg{border-left:3px solid var(--accent);padding:12px 16px;background:var(--accent-soft);border-radius:0 10px 10px 0}
.msg.bad{border-color:var(--bad)}
.cardbox{border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:10px;background:var(--surface)}
.cardnum{font-family:var(--f-mono);font-size:19px;letter-spacing:.06em;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.reacts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.reacts:empty{display:none}
.reacts button{padding:6px 12px;border-radius:99px;font-size:14px}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.photos canvas{width:100%;aspect-ratio:1;border-radius:10px;display:block;background:var(--bg);max-width:100%}
.feed{display:grid;gap:8px;max-height:260px;overflow:auto}
.feed div{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:13.5px;padding:8px 10px;border-radius:10px;background:var(--bg)}
.feed .ch{font-family:var(--f-mono);font-size:11px;font-weight:600;color:var(--accent)}
.feed .ch.tg{color:var(--info)}
.feed time{grid-column:1/-1;font-family:var(--f-mono);font-size:11px;color:var(--muted)}

.counters{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.counter{padding:14px 16px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.counter b{display:block;font-family:var(--f-display);font-size:28px}
.counter.hot{border-color:var(--accent)}
.alerts{display:grid;gap:8px;margin-bottom:16px}
.alerts:empty{display:none}
.alert{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 14px;border-radius:12px;border:1px solid var(--bad);background:var(--surface);flex-wrap:wrap}
.alert b{color:var(--bad)}
.printers{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.printer{padding:16px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:grid;gap:10px;align-content:start;min-width:0}
.printer.err{border-color:var(--bad)}
.printer .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.printer .model{font-size:13px;color:var(--muted)}
.spool{display:flex;align-items:center;gap:8px;font-size:13px;flex-wrap:wrap}
.adm table{min-width:820px}
.adm td{font-size:14px}
.act{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.act input,.act select{width:auto;padding:6px 8px;font-size:13px;max-width:220px}
.act input[type=number]{width:76px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.stock input{width:76px;padding:5px 6px;font-size:13px;font-family:var(--f-mono)}
.stock td.low input{border-color:var(--warn)}
.stock td.out input{border-color:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.hbar{display:grid;grid-template-columns:100px 1fr 52px;gap:10px;align-items:center;font-size:13px}
.hbar .bar-line{height:8px}
.settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.empty{padding:20px;text-align:center;color:var(--muted)}
.gap-top{margin-top:32px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid2>*{min-width:0}

.camimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#111316}
.banner{position:absolute;left:10px;bottom:10px;display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:8px;background:rgba(10,12,14,.72);color:#fff;font-family:var(--f-mono);font-size:12px;max-width:calc(100% - 20px);backdrop-filter:blur(4px)}
.camimg[hidden]{display:none}
video.camimg{object-fit:contain;background:#0A0C0F} /* show the whole frame, also for a camera turned to portrait */
.cam-buf{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:grid;justify-items:center;gap:6px;padding:12px 16px;border-radius:12px;background:rgba(10,12,14,.78);color:#fff;font-family:var(--f-mono);font-size:13px;text-align:center;max-width:calc(100% - 32px);backdrop-filter:blur(4px)}
.cam-buf b{font-size:22px;font-variant-numeric:tabular-nums;color:#FFB45E}
.cam-delay{color:#C9CEC8}
.banner b{font-family:var(--f-display);font-size:13px;color:#E3A84A;letter-spacing:.02em}
.banner span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.oled{position:absolute;right:10px;bottom:10px;width:min(48%,190px);aspect-ratio:2/1;background:#000;border:3px solid #2B2F33;border-radius:6px;padding:6px 8px;font-family:var(--f-mono);color:#8FE9FF;font-size:10px;line-height:1.2;display:grid;align-content:space-between;box-shadow:0 0 14px rgba(143,233,255,.18);max-width:100%}
.oled b{font-size:15px;color:#E9FBFF;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-weight:600}

/* ===== Skin B · «Чертёж»: light technical sheet, millimetre grid, cobalt accent ===== */
:root[data-skin="b"]{
  --bg:#F6F8FA; --surface:#FFFFFF; --ink:#0F1B2D; --muted:#4F5B6D; --line:#C7D0DC;
  --accent:#1F4FFF; --accent-ink:#FFFFFF; --accent-soft:#E7EDFF;
  --good:#0F7B5F; --warn:#9A6200; --bad:#C8361A; --info:#1F4FFF; --wa:#0F7B5F;
  --f-display:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --f-body:"Onest","Golos Text",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
[data-skin="b"] body{background-color:var(--bg);background-image:linear-gradient(#E4E9F0 1px,transparent 1px),linear-gradient(90deg,#E4E9F0 1px,transparent 1px);background-size:24px 24px}
[data-skin="b"] header{border-bottom:2px solid var(--ink)}
[data-skin="b"] .mark{display:none}
[data-skin="b"] .logo b{letter-spacing:-.02em;text-transform:uppercase}
[data-skin="b"] .logo b::before{content:"["}
[data-skin="b"] .logo b::after{content:"]"}
[data-skin="b"] h1,[data-skin="b"] h2{text-transform:uppercase;letter-spacing:-.03em}
[data-skin="b"] .hero h1 span:nth-child(3){background:var(--accent);color:var(--accent-ink);padding:0 .15em;align-self:flex-start;display:inline-block}
[data-skin="b"] nav a{border-radius:0;text-transform:uppercase;font-family:var(--f-mono);font-size:13px;letter-spacing:.03em}
[data-skin="b"] nav a[aria-current="page"]{background:transparent;box-shadow:inset 0 -2px 0 var(--accent);color:var(--ink)}
[data-skin="b"] button,[data-skin="b"] .btn{border-radius:0;border:2px solid var(--ink);text-transform:uppercase;font-family:var(--f-mono);font-size:13px;letter-spacing:.03em}
[data-skin="b"] .btn-primary{background:var(--ink);border-color:var(--ink);color:#FFFFFF}
[data-skin="b"] .btn-sm{border-width:1.5px}
[data-skin="b"] .panel,[data-skin="b"] .cardbox,[data-skin="b"] .svc,[data-skin="b"] .item,[data-skin="b"] .lcard,[data-skin="b"] .ocard,[data-skin="b"] .printer,[data-skin="b"] .counter{border-radius:0;border:2px solid var(--ink)}
[data-skin="b"] .panel,[data-skin="b"] .lcard,[data-skin="b"] .item{box-shadow:6px 6px 0 var(--ink)}
[data-skin="b"] .screen,[data-skin="b"] .viewer,[data-skin="b"] .drop,[data-skin="b"] .photos canvas,[data-skin="b"] .thumbs img{border-radius:0}
[data-skin="b"] .hero-art,[data-skin="b"] .cam{border:2px solid var(--ink);box-shadow:8px 8px 0 var(--ink)}
[data-skin="b"] .drop{border:2px dashed var(--ink)}
[data-skin="b"] select,[data-skin="b"] input[type=number],[data-skin="b"] input[type=text],[data-skin="b"] input[type=tel],[data-skin="b"] input[type=email],[data-skin="b"] input[type=url],[data-skin="b"] textarea{border-radius:0;border:1.5px solid var(--ink);background:#FFFFFF}
[data-skin="b"] .seg{border-radius:0;border:2px solid var(--ink)}
[data-skin="b"] .seg button{border:0;border-right:1.5px solid var(--ink)}
[data-skin="b"] .seg button:last-child{border-right:0}
[data-skin="b"] .seg button[aria-pressed="true"]{background:var(--ink);color:#FFFFFF}
[data-skin="b"] .pill{border-radius:0;border:1.5px solid currentColor;background:#FFFFFF;font-family:var(--f-mono);font-size:11.5px;text-transform:uppercase}
[data-skin="b"] .langs{border-radius:0;border:1.5px solid var(--ink)}
[data-skin="b"] .langs button{border:0;text-transform:none}
[data-skin="b"] .langs button[aria-pressed="true"]{background:var(--ink);color:#FFFFFF}
[data-skin="b"] .facts{border-block:2px solid var(--ink)}
[data-skin="b"] .facts b,[data-skin="b"] .price,[data-skin="b"] .big-pct{font-family:var(--f-mono);letter-spacing:-.04em}
[data-skin="b"] .steps li{border-top:2px solid var(--ink)}
[data-skin="b"] .steps li:first-child{border-color:var(--accent)}
[data-skin="b"] .msg{border-radius:0;border-left:4px solid var(--accent)}
[data-skin="b"] .banner{border-radius:0;background:#FFFFFF;color:var(--ink);border:1.5px solid var(--ink)}
[data-skin="b"] .banner b{color:var(--accent);font-family:var(--f-mono)}
[data-skin="b"] .banner b::before{content:"["}[data-skin="b"] .banner b::after{content:"]"}
[data-skin="b"] .bar-line{border-radius:0;height:12px;border:1.5px solid var(--ink);background:#FFFFFF}
[data-skin="b"] .bar-line i{background:repeating-linear-gradient(90deg,var(--accent) 0 6px,#163CC4 6px 8px)}
[data-skin="b"] .toast{border-radius:0;border:2px solid var(--ink);background:#FFFFFF;color:var(--ink);box-shadow:4px 4px 0 var(--ink)}
[data-skin="b"] .sw{border-radius:0}
[data-skin="b"] footer{border-top:2px solid var(--ink)}
/* ===== Order conveyor (track page): the order is a parcel riding a belt from station to station ===== */
.conv{display:grid;gap:8px;margin-bottom:22px}
.conv .belt{position:relative;height:44px}
.conv .belt::before{content:"";position:absolute;left:0;right:0;bottom:2px;height:12px;border-radius:7px;border:1px solid var(--line);
  background:repeating-linear-gradient(90deg,color-mix(in srgb,var(--muted) 35%,transparent) 0 2px,transparent 2px 16px),var(--surface);animation:belt .9s linear infinite}
@keyframes belt{to{background-position:16px 0,0 0}}
.conv.stop .belt::before{animation:none}
.conv .pkg{position:absolute;bottom:15px;left:-8%;width:34px;height:26px;transform:translateX(-50%);border-radius:5px;background:var(--accent);
  transition:left 2.2s cubic-bezier(.5,0,.2,1);box-shadow:0 0 22px color-mix(in srgb,var(--accent) 45%,transparent)}
.conv .pkg::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:7px;margin-left:-3.5px;background:rgba(0,0,0,.2)}
.conv .pkg::after{content:"";position:absolute;left:6px;right:6px;top:6px;height:2px;background:rgba(255,255,255,.35);border-radius:1px}
.conv .pkg.hop{animation:hop .45s ease-out}
@keyframes hop{40%{transform:translateX(-50%) translateY(-7px)}70%{transform:translateX(-50%) translateY(1px)}}
.conv .pkg.bad{background:var(--bad);box-shadow:none}
.conv .st{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.conv .st div{font-size:12.5px;line-height:1.25;color:var(--muted);text-align:center;display:grid;justify-items:center;gap:6px;overflow-wrap:anywhere}
.conv .st div::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--line)}
.conv .st .done{color:var(--ink)}
.conv .st .done::before{background:var(--accent)}
.conv .st .now{color:var(--ink);font-weight:600}
.conv .st .now::before{background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft);animation:blink 1.4s infinite}
@media (max-width:520px){.conv .st div{font-size:11px;overflow-wrap:normal;hyphens:auto}.conv .pkg{width:28px;height:22px}}
@media (max-width:400px){.conv .st div{font-size:10px;letter-spacing:-.02em}}
@media (prefers-reduced-motion:reduce){.conv .belt::before{animation:none}.conv .pkg{transition:none}}

/* ===== Skin C · «Цех»: deep dark workshop, hot-nozzle glow, live factory scene in the hero ===== */
:root[data-skin="c"]{
  --bg:#0B0D10; --surface:#14171B; --ink:#EEF0EA; --muted:#8F978F; --line:#262B31;
  --accent:#FFA53D; --accent-ink:#1A1104; --accent-soft:#3A2810;
  --good:#5CD08E; --warn:#F2C14E; --bad:#FF7A61; --info:#7FA8FF; --wa:#4CD08A;
  color-scheme:dark;
}
[data-skin="c"] body{background:radial-gradient(1200px 500px at 70% -10%,rgba(255,150,50,.09),transparent 60%),var(--bg) fixed}
[data-skin="c"] header{background:rgba(11,13,16,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
[data-skin="c"] .hero{grid-template-columns:1fr;gap:22px;padding-block:28px 18px}
[data-skin="c"] .hero>div:first-child{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:12px 32px}
[data-skin="c"] .hero>div:first-child h1{grid-column:1/-1}
[data-skin="c"] .hero h1{font-size:clamp(32px,6vw,64px)}
[data-skin="c"] .hero h1 span{display:inline-block;margin-right:.25em}
[data-skin="c"] .hero h1{overflow-wrap:anywhere}
[data-skin="c"] .hero p{margin-top:0}
[data-skin="c"] .hero-cta{margin-top:0}
[data-skin="c"] .hero-art{aspect-ratio:auto;height:clamp(250px,36vw,420px);border:1px solid var(--line);border-radius:18px;background:#0A0C0F;cursor:pointer}
[data-skin="c"] .btn-primary{box-shadow:0 0 0 0 rgba(255,165,61,0);transition:box-shadow .25s,transform .25s}
[data-skin="c"] .btn-primary:hover{box-shadow:0 6px 26px rgba(255,165,61,.35);transform:translateY(-1px)}
[data-skin="c"] .svc,[data-skin="c"] .item,[data-skin="c"] .lcard,[data-skin="c"] .panel{background:linear-gradient(180deg,rgba(255,255,255,.025),transparent 40%),var(--surface);transition:border-color .25s,transform .25s}
[data-skin="c"] .svc:hover,[data-skin="c"] .item:hover,[data-skin="c"] .lcard:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));transform:translateY(-2px)}
[data-skin="c"] .hero-art .hud{top:12px;bottom:auto;left:16px;right:16px}
[data-skin="c"] .facts b{color:var(--ink)}
[data-skin="c"] .facts div:first-child b{color:var(--accent)}
@media (max-width:720px){[data-skin="c"] .hero>div:first-child{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){[data-skin="c"] .svc,[data-skin="c"] .item,[data-skin="c"] .lcard{transition:none;transform:none!important}}

/* daily free print */
.free-banner{display:flex;gap:14px 20px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:18px 20px;border-radius:14px;border:1px solid color-mix(in srgb,var(--accent) 55%,var(--line));
  background:linear-gradient(100deg,var(--accent-soft),transparent 70%),var(--surface);margin-bottom:40px}

.lightbox{position:fixed;inset:0;z-index:60;background:rgba(5,6,8,.92);display:grid;place-items:center;padding:16px}

.lightbox button{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.2)}
@media (max-width:760px){.fr-now{grid-template-columns:1fr}}
/* real site: no demo banner, no demo operator panel for visitors */
.online .demo-note, .online nav a[data-route="admin"]{display:none}
/* operator panel */
.ops-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}

.tg-top{display:flex;gap:12px 20px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:16px 18px;border-radius:14px;margin-bottom:18px;
  border:1px solid color-mix(in srgb,#2AABEE 60%,var(--line));background:linear-gradient(100deg,color-mix(in srgb,#2AABEE 16%,transparent),transparent 75%),var(--surface)}

fr_rules:[
 ['Hər gün <b>bir qalib</b>. Seçim Bakı vaxtı ilə 20:00-da yoxlanmış müraciətlər arasından təsadüfi aparılır.','Каждый день <b>один победитель</b>. Розыгрыш в 20:00 по Баку — случайный выбор среди заявок, прошедших проверку.','Щодня <b>один переможець</b>. Розіграш о 20:00 за Баку — випадковий вибір серед перевірених заявок.','<b>One winner</b> every day, drawn at random at 20:00 Baku time among checked applications.'],
 ['Limit: <b>1 detal, 105 q-a qədər plastik, 4 saata qədər çap, 150×150×150 mm-ə qədər</b>. Material PLA, rəng mövcud olanlardan.','Лимит: <b>1 деталь, до 105 г пластика, до 4 ч печати, до 150×150×150 мм</b>. Материал PLA, цвет из наличия.','Ліміт: <b>1 деталь, до 105 г пластику, до 4 год друку, до 150×150×150 мм</b>. Матеріал PLA, колір із наявних.','Limit: <b>1 part, up to 105 g of plastic, up to 4 h of printing, up to 150×150×150 mm</b>. PLA in a colour we have in stock.'],
 ['Bir nömrədən gündə <b>bir müraciət</b>. Qalib yenidən <b>30 gündən sonra</b> iştirak edə bilər.','С одного номера — <b>одна заявка в день</b>. Победитель может снова участвовать <b>через 30 дней</b>.','З одного номера — <b>одна заявка на день</b>. Переможець може знову брати участь <b>через 30 днів</b>.','<b>One application per phone number per day</b>. A winner can take part again <b>after 30 days</b>.'],
 ['Olmaz: silah və onun hissələri, 18+, təhqiramiz məzmun, satış üçün başqasının brendi, lisenziyası qadağan edən modellər. Operator səbəbsiz imtina edə bilər.','Нельзя: оружие и его детали, 18+, оскорбительное, чужие бренды на продажу, модели с запретом в лицензии. Оператор может отклонить заявку без объяснения причин.','Не можна: зброя та її деталі, 18+, образливе, чужі бренди на продаж, моделі із забороною в ліцензії. Оператор може відхилити заявку без пояснень.','Not allowed: weapons or their parts, 18+, offensive content, other brands for resale, models whose licence forbids it. The operator may decline without giving a reason.'],
 ['Model limitdən böyükdürsə — kiçildilmiş surətini və ya endirimli çap təklif edərik.','Если модель больше лимита — предложим уменьшенную копию или печать со скидкой.','Якщо модель більша за ліміт — запропонуємо зменшену копію або друк зі знижкою.','If the model is over the limit, we offer a scaled-down copy or a discounted print.'],
 ['Qalibin çapı <b>canlı yayımda</b> printer bannerində adı ilə göstərilir; hazır detalın fotosunu dərc edə bilərik.','Печать победителя идёт <b>в прямом эфире</b> с его именем на баннере принтера; фото готовой детали можем опубликовать.','Друк переможця йде <b>у прямому ефірі</b> з його ім\'ям на банері принтера; фото готової деталі можемо опублікувати.','The winner\'s print is <b>streamed live</b> with their name on the printer banner; we may publish a photo of the part.'],
 ['Detalı Bakıda <b>7 gün ərzində</b> götürmək lazımdır (kuryer — tarif üzrə).','Забрать деталь в Баку <b>в течение 7 дней</b> (курьер — по тарифу).','Забрати деталь у Баку <b>протягом 7 днів</b> (кур\'єр — за тарифом).','Collect the part in Baku <b>within 7 days</b> (courier at the usual rate).'],

q1:['Hansı faylları qəbul edirsiniz?','Какие файлы принимаете?','Які файли приймаєте?','Which files do you accept?'],
a1:['STL — qiymət dərhal hesablanır. 3MF, OBJ və STEP-i operator əl ilə hesablayır. Fayl yoxdursa, detalın fotosunu göndərin.','STL — цена считается сразу. 3MF, OBJ и STEP оператор считает вручную. Нет файла — пришлите фото детали.','STL — ціна рахується одразу. 3MF, OBJ і STEP оператор рахує вручну. Немає файлу — надішліть фото деталі.','STL is priced instantly. 3MF, OBJ and STEP are priced by an operator. No file? Send photos of the part.'],
q2:['Niyə əvvəl aralıq, sonra yekun qiymət?','Почему сначала вилка, а потом итоговая цена?','Чому спершу діапазон, а потім підсумкова ціна?','Why a range first and the final price later?'],
a2:['Avtomatik hesab dəqiqdir, amma dəstəkləri, yığılmanı və mürəkkəb formanı operator yoxlayır. Adətən yekun qiymət aralığın içində olur.','Автоматический расчёт точный, но поддержки, сборку и сложную форму проверяет оператор. Обычно итог попадает в вилку.','Автоматичний розрахунок точний, але підтримки, збирання й складну форму перевіряє оператор. Зазвичай підсумок потрапляє в діапазон.','The automatic estimate is accurate, but an operator checks supports, assembly and tricky shapes. The final price usually lands inside the range.'],
q3:['Necə ödəyim və bildirişlər haradan gəlir?','Как оплатить и куда приходят уведомления?','Як оплатити й куди надходять сповіщення?','How do I pay and where do updates arrive?'],

a3:['Təsdiqdən sonra kart nömrəsi sifariş səhifəsində görünür və Telegram-a və ya e-poçta gəlir. 50% çapdan əvvəl, qalanı təhvil zamanı.','После подтверждения номер карты появится на странице заказа и придёт в Telegram или на почту. 50% до печати, остальное при получении.','Після підтвердження номер картки з’явиться на сторінці замовлення й надійде в Telegram або на пошту. 50% до друку, решта під час отримання.','After confirmation the card number appears on your order page and arrives on Telegram or by email. 50% before printing, the rest on collection.'],

q4:['Çap uğursuz olsa?','Что если печать не удалась?','Що як друк не вдався?','What if a print fails?'],
a4:['Təhvildən əvvəl detalın fotosunu göndəririk. Qəbul etməzdən öncə sual verə bilərsiniz; bizim səhvimizdən olan qüsuru pulsuz yenidən çap edirik.','Перед выдачей присылаем фото детали. До приёмки можно задать вопрос; брак по нашей вине перепечатываем бесплатно.','Перед видачею надсилаємо фото деталі. До приймання можна поставити запитання; брак із нашої вини передруковуємо безкоштовно.','We send photos before collection. You can raise a question before accepting; defects caused by us are reprinted free.'],
q5:['Endirimlər varmı?','Есть скидки?','Є знижки?','Any discounts?'],
a5:['Hər 5-ci sifariş −30%. Tələbələrə istənilən sifarişə −15%, uşaq oyuncaqlarına −15%. Dostunuza kodunuzu verin: ona −10%, sizə növbəti sifarişdə −10%. Endirimlər toplanmır — ən böyüyü tətbiq olunur. Hər gün isə bir çapı pulsuz edirik.','Каждый 5-й заказ −30%. Студентам −15% на любой заказ, детские игрушки −15%. Дайте другу свой код: ему −10%, вам −10% на следующий заказ. Скидки не суммируются — действует наибольшая. А ещё каждый день одну печать разыгрываем бесплатно.','Кожне 5-те замовлення −30%. Студентам −15% на будь-яке замовлення, дитячі іграшки −15%. Дайте другу свій код: йому −10%, вам −10% на наступне замовлення. Знижки не сумуються — діє найбільша. А ще щодня один друк розігруємо безкоштовно.','Every 5th order is 30% off. Students get 15% off any order, kids\' toys 15% off. Give a friend your code: 10% off for them and for your next order. Discounts don\'t stack — the largest applies. And every day we give one print away for free.'],
q6:['Çatdırılma varmı?','Есть доставка?','Є доставка?','Do you deliver?'],
a6:['Bakı daxilində kuryer — 5 AZN, ya da emalatxanadan özünüz götürün.','Курьер по Баку — 5 AZN, или самовывоз из мастерской.','Кур’єр по Баку — 5 AZN, або самовивіз із майстерні.','Courier within Baku is 5 AZN, or pick up from the workshop.'],

/* ---------- delayed stream player ----------
   The bridge uploads the camera as chunks of JPEG frames (format "S3D1": count, then [dt ms, length, jpeg]…).
   We play them STREAM_DELAY behind the newest chunk, so there is always footage ready and playback stays smooth.
   Times are the bridge's own clock, so client/server clock skew doesn't matter. */
const PLAYER = { key:'', chunks:new Map(), frames:[], loading:new Set(), latestEnd:0, earliest:0, anchorAt:0, delay:15000, playing:false, cur:null, url:null, listAt:0, since:0 };
function playerReset(key){
  if (PLAYER.url) URL.revokeObjectURL(PLAYER.url);
  PLAYER.frames.forEach(x => x.bmp && x.bmp.close());
  const cv = document.getElementById('cam-video'); if (cv) cv.hidden = true;
  Object.assign(PLAYER, { key, chunks:new Map(), frames:[], loading:new Set(), latestEnd:0, earliest:0, anchorAt:0, playing:false, cur:null, url:null, listAt:0, since:0 });
}
const chunkQs = o => o && o.code ? `order=${o.id}&code=${o.code}&` : '';
async function playerList(pid, o){
  PLAYER.listAt = Date.now();
  try {
    const j = await api(`/api/cam/${pid}/chunks?${chunkQs(o)}since=${PLAYER.since}`);
    PLAYER.delay = j.delay || 15000;
    for (const c of j.chunks){ if (!PLAYER.chunks.has(c.t0)) PLAYER.chunks.set(c.t0, c); PLAYER.since = Math.max(PLAYER.since, c.t0); }
    const all = [...PLAYER.chunks.values()];
    if (all.length){
      const end = Math.max(...all.map(c => c.t0 + c.dur));
      if (end > PLAYER.latestEnd){ PLAYER.latestEnd = end; PLAYER.anchorAt = performance.now(); }
      PLAYER.earliest = Math.min(...all.map(c => c.t0));
    }
  } catch(e){}
}
async function playerLoad(pid, o, c){
  PLAYER.loading.add(c.t0);
  try {
    const r = await fetch(`/api/cam/${pid}/chunk/${c.t0}?${chunkQs(o)}`); if (!r.ok) throw 0;
    const b = new Uint8Array(await r.arrayBuffer()), dv = new DataView(b.buffer);
    if (String.fromCharCode(...b.subarray(0,4)) !== 'S3D1') throw 0;
    const n = dv.getUint16(4, true); let p = 6;
    for (let i = 0; i < n && p + 8 <= b.length; i++){ const dt = dv.getUint32(p, true), len = dv.getUint32(p + 4, true); p += 8;
      PLAYER.frames.push({ t: c.t0 + dt, blob: new Blob([b.subarray(p, p + len)], {type:'image/jpeg'}) }); p += len; }
    PLAYER.frames.sort((a, b) => a.t - b.t); c.done = true;
  } catch(e){ c.failed = (c.failed || 0) + 1; }
  PLAYER.loading.delete(c.t0);
}

  if (pr.pct) list.push([t('d_promo',{c:pr.code}), pr.pct]);
  if ($('f-student').checked) list.push([t('d_student'), S.settings.student ?? 15]);
  if ($('f-kids').checked) list.push([t('d_kids'), S.settings.kids ?? 15]);
  if (loyaltyNext()) list.push([t('d_loyal'), S.settings.loyal]);
  // discounts don't stack: the largest one applies
  const best = list.reduce((a, b) => (b[1] > (a ? a[1] : -1) ? b : a), null);
  return {list, best, total: best ? Math.min(30, best[1]) : 0};
}

/* ---------- pricing ---------- */
function compute(m){
  const st = S.settings, mat = $('f-mat').value, qty = Math.max(1, Math.min(50, Math.round(+$('f-qty').value || 1)));
  const max = Math.max(m.x, m.y, m.z), base = Math.min(m.x, m.y);
  const type = (max <= 256 && mat !== 'ABS') ? 'A1' : 'K2';
  const grams = m.volCm3 * DENS[mat] * FILL[form.infill];
  const hours = Math.max(.3, grams / (type === 'K2' ? 14 : 11)) * QTIME[form.quality];
  const urg = form.urgent === '1' ? 1.5 : 1, d = discounts();
  const raw = (grams * st.cg * K_MAT[mat] + hours * (type === 'K2' ? st.k2 : st.a1)) * qty + st.setup;
  const p = Math.max(st.min, raw * urg * (1 - d.total/100)) + (form.deliv === '1' ? st.cour : 0);
  const reasons = [];
  if (qty > 3) reasons.push('r_qty');
  if (mat === 'TPU') reasons.push('r_tpu');
  if (m.z > 4 * base && m.z > 60) reasons.push('r_tall');
  if (m.volCm3 < .5) reasons.push('r_tiny');
  if (m.tris > 400000) reasons.push('r_dense');
  if (!available(mat, form.color)) reasons.push('r_nostock');
  return {mat, qty, type, tooBig:max > 345, grams, hours, urg, p, lo:Math.floor(p*.9), hi:Math.ceil(p*1.2), reasons, max, d};
}

/* ---------- STL parsing ---------- */
function parseSTL(buf){
  const dv = new DataView(buf), n = buf.byteLength >= 84 ? dv.getUint32(80, true) : 0;
  const isBin = n > 0 && buf.byteLength === 84 + n*50;
  let vol = 0, tris = 0; const mn = [1e9,1e9,1e9], mx = [-1e9,-1e9,-1e9], pos = [];
  const add = (a,b,c) => {
    vol += (a[0]*(b[1]*c[2]-b[2]*c[1]) - a[1]*(b[0]*c[2]-b[2]*c[0]) + a[2]*(b[0]*c[1]-b[1]*c[0])) / 6;
    for (const v of [a,b,c]){ for (let k=0;k<3;k++){ if (v[k]<mn[k]) mn[k]=v[k]; if (v[k]>mx[k]) mx[k]=v[k]; } pos.push(v[0],v[1],v[2]); }
    tris++;
  };
  if (isBin){
    for (let i=0;i<n;i++){ const o = 84 + i*50 + 12, r = j => [dv.getFloat32(o+j*12,true), dv.getFloat32(o+j*12+4,true), dv.getFloat32(o+j*12+8,true)]; add(r(0), r(1), r(2)); }
  } else {
    const txt = new TextDecoder().decode(buf), re = /vertex\s+([-\d.eE+]+)\s+([-\d.eE+]+)\s+([-\d.eE+]+)/g; let mm, vs = [];
    while ((mm = re.exec(txt))){ vs.push([+mm[1],+mm[2],+mm[3]]); if (vs.length === 3){ add(...vs); vs = []; } }
  }
  if (!tris) throw new Error('empty');
  return {x:mx[0]-mn[0], y:mx[1]-mn[1], z:mx[2]-mn[2], volCm3:Math.abs(vol)/1000, tris, pos:new Float32Array(pos), zUp:true};
}
function loadFile(f){
  if (!f) return;
  form.modelFile = f; // the original file, uploaded to the operators after the order is created
  if (!/\.stl$/i.test(f.name)){
    form.model = {file:f.name, manual:true}; $('drop-title').textContent = f.name; $('drop-sub').textContent = t('manual_quote');
    $('viewer').hidden = true; renderQuote(); return;
  }
  const r = new FileReader();
  r.onload = () => {
    try {
      const m = parseSTL(r.result); m.file = f.name; form.model = m;
      $('drop-title').textContent = f.name; $('drop-sub').textContent = `${m.tris.toLocaleString()} △ · ${m.volCm3.toFixed(1)} cm³`;
      if (!$('f-name').value) $('f-name').value = f.name.replace(/\.stl$/i,'');
      showModel(m); renderQuote();
    } catch(e){ toast(t('t_bad_file')); }
  };
  r.readAsArrayBuffer(f);
}

/* ---------- 3D viewer ---------- */
let V = null;
function initViewer(){
  if (V || !window.THREE) return V;
  const renderer = new THREE.WebGLRenderer({canvas:$('v-canvas'), antialias:true, alpha:true});
  renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
  const scene = new THREE.Scene(), cam = new THREE.PerspectiveCamera(35, 1.6, 1, 5000);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x555555, .9));
  const dl = new THREE.DirectionalLight(0xffffff, .8); dl.position.set(200, 400, 300); scene.add(dl);
  const grid = new THREE.GridHelper(256, 16, 0x9a8f7a, 0x9aa19b); grid.material.opacity = .35; grid.material.transparent = true; scene.add(grid);
  const holder = new THREE.Group(); scene.add(holder);
  const mat = new THREE.MeshStandardMaterial({color:0x2a2d31, roughness:.55, metalness:.05});
  V = {renderer, scene, cam, holder, mat, mesh:null, rot:.6, drag:false, lastX:0, idle:0, dist:300, h:50};
  const vw = $('viewer');
  vw.addEventListener('pointerdown', e => { V.drag = true; V.lastX = e.clientX; vw.setPointerCapture(e.pointerId); vw.style.cursor = 'grabbing'; });
  vw.addEventListener('pointermove', e => { if (!V.drag) return; V.rot += (e.clientX - V.lastX) * .01; V.lastX = e.clientX; V.idle = performance.now(); });
  vw.addEventListener('pointerup', () => { V.drag = false; vw.style.cursor = 'grab'; });
  return V;
}
function showModel(m){
  $('viewer').hidden = false;
  if (!initViewer()){ $('viewer').hidden = true; return; }
  let geo;
  if (m.lathe){
    const pts = [new THREE.Vector2(0,0)]; for (let i=0;i<=40;i++){ const k = i/40; pts.push(new THREE.Vector2(m.x/2*profile(k,'pot')/.5, k*m.z)); }
    geo = new THREE.LatheGeometry(pts, 72);
  } else {
    geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(m.pos, 3));
    if (m.zUp) geo.rotateX(-Math.PI/2);
    geo.computeBoundingBox(); const b = geo.boundingBox; geo.translate(-(b.min.x+b.max.x)/2, -b.min.y, -(b.min.z+b.max.z)/2);
  }
  geo.computeVertexNormals();
  if (V.mesh){ V.holder.remove(V.mesh); V.mesh.geometry.dispose(); }
  V.mesh = new THREE.Mesh(geo, V.mat); V.holder.add(V.mesh);
  geo.computeBoundingSphere();
  V.h = Math.max(m.z, 20); V.dist = Math.max(160, geo.boundingSphere.radius * 3.2);
  V.mat.color.set(COLORS[form.color][1]);
}
function drawViewer(now){
  if (!V || $('viewer').hidden || form.kind !== 'file') return;
  const cv = $('v-canvas'), w = cv.clientWidth, h = cv.clientHeight; if (!w) return;
  if (cv.width !== Math.round(w*V.renderer.getPixelRatio())){ V.renderer.setSize(w, h, false); V.cam.aspect = w/h; V.cam.updateProjectionMatrix(); }
  if (!V.drag && now - V.idle > 1500 && !reduce) V.rot += .006;
  V.holder.rotation.y = V.rot;
  V.cam.position.set(0, V.h*.55 + V.dist*.35, V.dist); V.cam.lookAt(0, V.h*.4, 0);
  V.renderer.render(V.scene, V.cam);
}

/* ---------- drawing ---------- */
function profile(k, shape){
  switch(shape){
    case 'pot': return .38 + .12*k + .02*Math.sin(k*30);
    case 'stand': return k < .2 ? .5 : k < .3 ? .2 : .2 + .25*Math.max(0, Math.sin((k-.3)*3));
    case 'hooks': return k < .55 ? .12 : .12 + .3*Math.sin((k-.55)*3.4);
    case 'box': return k < .9 ? .48 : .5;
    case 'clip': return .22 + .18*Math.abs(Math.sin(k*Math.PI*2));
    case 'head': return k < .1 ? .42 : k < .85 ? .07 : .07 + .35*Math.sin((k-.85)*10);
    default: return .34 + .16*Math.sin(k*Math.PI*1.15 + .3) + .05*Math.sin(k*Math.PI*5);
  }
}
function sizeCanvas(cv){
  const dpr = devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
  if (!w || !h) return null;
  if (cv.width !== Math.round(w*dpr)){ cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr); }
  const g = cv.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0); return {g, w, h};
}
function drawPrint(cv, progress, layers, color, nozzleT, shape, fault){

  g.fillStyle = '#8A6A33'; g.fillRect(cx-bw/2, bedY-2, bw, 3);
  const L = Math.min(layers, 260), maxH = h*.58, lh = maxH/L, done = Math.floor(progress*L), objW = w*.42;
  for (let i=0;i<done;i++){
    const half = profile(i/L, shape)*objW, y = bedY - (i+1)*lh;
    g.fillStyle = color; g.fillRect(cx-half, y, half*2, lh+.6);
    if (i%2===0){ g.fillStyle = 'rgba(0,0,0,.16)'; g.fillRect(cx-half, y, half*2, Math.max(.4, lh*.35)); }
  }
  const sh = g.createLinearGradient(cx-objW*.6,0,cx+objW*.6,0);
  sh.addColorStop(0,'rgba(0,0,0,.35)'); sh.addColorStop(.45,'rgba(255,255,255,.1)'); sh.addColorStop(1,'rgba(0,0,0,.45)');
  g.globalCompositeOperation = 'source-atop'; g.fillStyle = sh; g.fillRect(cx-objW, bedY-maxH-2, objW*2, maxH+2); g.globalCompositeOperation = 'source-over';
  const half = profile(done/L, shape)*objW, ny = bedY - done*lh - lh;
  if (fault){
    g.strokeStyle = color; g.lineWidth = 1.4;
    for (let i=0;i<26;i++){ g.beginPath(); g.moveTo(cx + Math.sin(i*1.7)*half, ny); g.bezierCurveTo(cx + Math.sin(i*2.3)*half*1.6, ny-30-(i%5)*6, cx + Math.cos(i*1.1)*half*1.4, ny-50, cx + Math.sin(i*0.7)*half*.8, ny-24); g.stroke(); }
  }

function drawCountdown(){ // ms until the next 20:00 in Baku

    if (o.server && !o.printer){ o.progress = Math.min(.98, o.progress + (o.speed || 1/120)); changed = true; continue; }
    const s = PS(o.printer);
    if (o.pub){ o.viewers = Math.max(2, Math.min(60, (o.viewers||3) + Math.round(Math.random()*2 - .8))); if (Math.random() < .15){ o.react = o.react || {}; const k = ['fire','clap','wow'][Math.floor(Math.random()*3)]; o.react[k] = (o.react[k]||0) + 1; } }

    if (!o.half && o.progress >= .5){ o.half = true; clientNotif(o, 'n_half'); }

      if (tlStart && fin){ const k = (now - tlStart)/6000; if (k < 1){ p = k; noz = tm*14; } else tlStart = 0; }
      drawPrint($('cam-canvas'), p, o.layers, COLORS[o.color][1], noz, o.shape, err);
    }
  }
  requestAnimationFrame(frame);
}

window.addEventListener('hashchange', show);
applyLang(); show(); badges();
detectServer();
setInterval(() => { if (route() === 'track'){ const o = O(trackId); if (o) syncOrder(o); } else if (route() === 'orders') S.orders.filter(o => o.server && !['done','rejected'].includes(o.status)).slice(0,5).forEach(syncOrder); }, 4000);
setInterval(tick, 1000);
requestAnimationFrame(frame);
})();
</script>
