<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#090b0d" />
  <title>Start3D</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="home-shell">
    <header class="topbar">
      <a class="brand" href="#" aria-label="Start3D">START<span>3D</span></a>
      <div class="status"><i></i> Сервис онлайн</div>
    </header>

    <section class="hero">
      <div class="hero-copy">
        <p class="eyebrow">3D PRINTING ON DEMAND</p>
        <h1>Что будем<br><em>печатать?</em></h1>
        <p class="subtitle">Загрузи модель, получи расчёт и следи за печатью онлайн.</p>
      </div>

      <div class="entry-grid" aria-label="Разделы Start3D">
        <button class="entry-card primary" data-screen="order">
          <span class="icon">＋</span>
          <span class="entry-text">
            <b>Заказать</b>
            <small>Загрузить модель и рассчитать стоимость</small>
          </span>
          <span class="arrow">↗</span>
        </button>

        <button class="entry-card" data-screen="my-order">
          <span class="icon">◎</span>
          <span class="entry-text">
            <b>Мой заказ</b>
            <small>Статус, прогресс и live-камера</small>
          </span>
          <span class="arrow">→</span>
        </button>

        <button class="entry-card operator" data-screen="operator">
          <span class="icon">⌘</span>
          <span class="entry-text">
            <b>Оператор</b>
            <small>Заявки, очередь и 4 принтера</small>
          </span>
          <span class="arrow">→</span>
        </button>
      </div>
    </section>

    <section class="screen" id="screen" hidden>
      <button class="back" id="backBtn">← На главную</button>
      <div id="screenContent"></div>
    </section>

    <footer>
      <span>START3D / BAKU</span>
      <span>Upload → Start → Watch</span>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
